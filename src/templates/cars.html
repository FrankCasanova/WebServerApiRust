<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cars to repair</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="/">GarageTeam</a>
        <a class="navbar-brand" href="/garages">Garages</a>
        <a class="navbar-brand" href="/cars">Cars</a>
    </nav>
    <main class="container">
        <h3>Cars List</h3>
        <div id="assign-error" class="alert alert-danger d-none"></div>
        {% for car in cars %}
        <ul class="list-group">
            <li class="list-group-item">
                <ul class="list-group list-group-horizontal">
                    <li class="list-group-item">{{ car.modelo }}</li>
                    <li class="list-group-item">{{ car.fecha_entrada }}</li>
                    <li class="list-group-item">
                        <select class="form-select d-inline w-auto garage-select" data-car-id="{{ car.id }}"></select>
                        <button type="button" class="btn btn-success ms-2" onclick="assignCarToGarage('{{ car.id }}')">Assign to garage</button>
                    </li>
                </ul>
            </li>
        </ul>
        {% endfor %}
        <a  class="btn btn-primary m-2" href="/cars/create_car">Create new car</a>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
        crossorigin="anonymous"></script>
    <script>
        // esto ha sido generado por copilot, un poquito de vibe coding tampoco es malo vamos a ver...
        // ni de coña escribo yo esta función a pelo.
        function loadAvailableGarages() {
            fetch('/api/garages/available')
                .then(res => res.json())
                .then(garages => {
                    document.querySelectorAll('.garage-select').forEach(select => {
                        select.innerHTML = '';
                        garages.forEach(g => {
                            const option = document.createElement('option');
                            option.value = g.id;
                            option.textContent = g.name + ' (Capacidad: ' + g.capacity + ')';
                            select.appendChild(option);
                        });
                        // If no garages available, disable the select and button
                        if (garages.length === 0) {
                            select.disabled = true;
                            select.parentElement.querySelector('button').disabled = true;
                        } else {
                            select.disabled = false;
                            select.parentElement.querySelector('button').disabled = false;
                        }
                    });
                });
        }
        loadAvailableGarages();

        // Asignar coche a garaje, esta ha sido una mezcla de vibecoding y un poco de artesanía de antaño
        // no soy experto en javascript pero funciona
        function assignCarToGarage(id) {
            const select = document.querySelector('.garage-select[data-car-id="' + id + '"]');
            const garageId = select.value;
            let data = {
                "car_to_repair": id,
                "garage_id": parseInt(garageId)
            };
            const options = {
                method: 'POST',
                headers: {
                    "Content-Type": "application/json; charset=utf-8"
                },
                body: JSON.stringify(data)
            };
            let url = "/api/workingcar/assingcar";
            fetch(url, options)
                .then(response => response.text().then(text => ({ ok: response.ok, text })))
                .then(({ ok, text }) => {
                    if (ok) {
                        alert("Coche asignado correctamente");
                        loadAvailableGarages();
                    } else {
                        document.getElementById('assign-error').classList.remove('d-none');
                        document.getElementById('assign-error').textContent = text;
                    }
                })
                .catch(err => alert("Error: " + err));
        }
    </script>
</body>

</html>
